<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hayate Run —疾風RUN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231b1340%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23ff7eb6%27%3E%E7%96%BE%3C/text%3E%3C/svg%3E">
<meta name="description" content="Hayate Run: an anime-opening-inspired browser runner. 12 original runners, 160 cinematic worlds, beat-synced camera.">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/menu.css">
<link rel="stylesheet" href="styles/game.css">
</head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0 m</span><span id="score">0 pts</span><span id="combo"></span><span class="mid" id="envname"></span><span id="hp"></span><button id="pauseBtn" aria-label="Pause">II</button></div>
<div id="progwrap"><div id="prog"></div></div>
<div id="sty"></div><div id="envb"></div><div id="cap"></div><div id="cred"><b id="c1"></b><span id="c2"></span></div>

<div class="scr" id="menu">
  <div class="title"><b>疾風<br>RUN</b><i>Run through the opening.</i></div>
  <div class="panel">
    <h2>Pick a song</h2><div class="row" id="songs"></div>
    <h2>Pick your runner</h2><div class="row" id="chars"></div>
    <h2>Look</h2><select id="look" class="card" aria-label="Render style"><option value="0">Auto: changes with the music</option><option value="1">Anime</option><option value="2">Cartoon</option><option value="3">Paper</option><option value="4">Manga</option><option value="5">Comic</option><option value="6">3D</option><option value="7">Flat 2D</option><option value="8">Realistic</option></select>
    <h2>World</h2><select id="env" class="card" aria-label="World"><option value="auto">Auto: cuts with the song structure</option><option value="random">Random of all 160</option></select>
    <h2>Quality</h2><div class="setrow"><select id="quality" class="card" aria-label="Quality" style="flex:1"><option value="LOW">LOW</option><option value="MEDIUM">MEDIUM</option><option value="HIGH">HIGH</option><option value="ULTRA">ULTRA</option></select><label><input type="checkbox" id="qauto" checked> auto</label><label><input type="checkbox" id="mute"> mute</label></div>
    <h2>Your own song</h2><label class="card" style="transform:none"><input id="file" type="file" accept="audio/*" hidden><strong>Load an audio file</strong><br><span id="fn">Optional. Plays instead of the built-in track. Set its BPM below.</span></label>
    <label><small class="h">BPM of your file </small><input id="bpm" type="number" value="100" min="60" max="200" style="width:70px"></label>
    <button class="go" id="go">Start running</button>
    <small class="h">← → or A/D to change lane · ↑ / Space / W to jump · P or Esc pauses · M mutes. Touch: swipe left/right, swipe up or tap to jump. Grab stars for combo score.</small>
    <small id="credits"></small>
  </div>
</div>
<div class="scr off" id="pause"><div class="panel"><h2 style="font-size:34px">Paused — 休憩</h2><button class="go" id="resume">Resume</button><button class="ghost" id="restart">Restart run</button><button class="ghost" id="quit">Quit to menu</button></div></div>
<div class="scr off" id="end"><div class="panel" style="text-align:center;align-items:center"><h1 id="eh"></h1><h2 id="es"></h2><button class="go" id="again">Run again</button></div></div>

<script src="src/engine.js"></script>
<script src="src/audio.js"></script>
<script src="src/characters.js"></script>
<script src="src/animation.js"></script>
<script src="src/environments.js"></script>
<script src="src/renderer.js"></script>
<script src="src/weather.js"></script>
<script src="src/lighting.js"></script>
<script src="src/particles.js"></script>
<script src="src/effects.js"></script>
<script src="src/camera.js"></script>
<script src="src/director.js"></script>
<script src="src/player.js"></script>
<script src="src/collision.js"></script>
<script src="src/input.js"></script>
<script src="src/ui.js"></script>
<script src="src/performance.js"></script>
<script src="src/main.js"></script>
</body></html>
