<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hayate Run</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1340;--sakura:#ff7eb6;--sun:#ffb347;--mint:#3de0d0;--paper:#fff4e6;--disp:'Dela Gothic One',Impact,sans-serif;--body:'Zen Kaku Gothic New','Hiragino Sans',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#1b1340;color:var(--paper);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:4vw;padding:24px;background:linear-gradient(160deg,#2a1458 0%,#7a2f8f 45%,#ff7a8a 80%,#ffc27a 100%);z-index:5}
.scr.off{display:none}
.title{transform:skewX(-8deg);flex:0 1 auto}
.title b{display:block;font:400 clamp(64px,13vw,160px)/.9 var(--disp);color:var(--paper);text-shadow:5px 5px 0 var(--ink),-2px -2px 0 var(--sakura)}
.title i{display:block;font:400 clamp(22px,4vw,44px)/1.2 var(--disp);font-style:normal;color:var(--sun);margin-top:.4em;text-shadow:3px 3px 0 var(--ink)}
.panel{width:min(480px,100%);display:flex;flex-direction:column;gap:12px}
h2{margin:6px 0 0;font:400 18px var(--disp)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card{flex:1 1 130px;background:rgba(27,19,64,.72);color:var(--paper);border:3px solid transparent;border-radius:4px;padding:10px;text-align:left;font:inherit;cursor:pointer;transform:skewX(-6deg)}
.card[aria-pressed=true]{border-color:var(--sakura);background:var(--ink);box-shadow:5px 5px 0 var(--sakura)}
.card:focus-visible,.go:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.card strong{display:block;font-weight:900;font-size:16px}.card span{font-size:12px;opacity:.8}
.card svg{width:44px;height:44px;float:right;margin-left:6px}
.go{margin-top:8px;font:400 22px var(--disp);padding:14px;border:0;background:var(--sun);color:var(--ink);cursor:pointer;transform:skewX(-8deg);box-shadow:6px 6px 0 var(--ink)}
.go:active{transform:skewX(-8deg) translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
small.h{opacity:.75;font-size:12px}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8vh);left:16px;right:16px;display:flex;justify-content:space-between;font:400 22px var(--disp);text-shadow:2px 2px 0 var(--ink);z-index:2;pointer-events:none}
#hud #hp{color:var(--sakura)}
#cap{position:fixed;left:50%;top:22%;font:400 clamp(40px,10vw,110px) var(--disp);color:var(--paper);text-shadow:5px 5px 0 var(--ink),-3px -3px 0 var(--sakura);white-space:nowrap;opacity:0;pointer-events:none;z-index:2;transform:translateX(-50%) skewX(-10deg)}
#cap.pop{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateX(-30%) skewX(-10deg) scale(1.4)}12%{opacity:1;transform:translateX(-50%) skewX(-10deg)}70%{opacity:1}100%{opacity:0;transform:translateX(-62%) skewX(-10deg)}}
#cred{position:fixed;left:6vw;bottom:14vh;z-index:2;pointer-events:none;opacity:0;transform:skewX(-8deg)}
#cred.pop{animation:cr 4s ease-out}
#cred b{display:block;font:400 clamp(28px,6vw,64px) var(--disp);text-shadow:4px 4px 0 var(--ink)}
#cred span{font-weight:900;font-size:clamp(14px,2.4vw,22px);background:var(--ink);padding:2px 10px}
@keyframes cr{0%{opacity:0;transform:translateX(-40px) skewX(-8deg)}10%,75%{opacity:1;transform:skewX(-8deg)}100%{opacity:0}}
#end h1{font:400 clamp(40px,9vw,90px) var(--disp);margin:0;transform:skewX(-8deg);text-shadow:5px 5px 0 var(--ink)}
#sty{position:fixed;right:5vw;bottom:calc(env(safe-area-inset-bottom,0px) + 10vh);font:400 22px var(--disp);opacity:0;z-index:2;background:var(--sun);color:var(--ink);padding:2px 12px;transform:skewX(-10deg);pointer-events:none}
#sty.pop{animation:sty 2s}@keyframes sty{0%{opacity:0;transform:translateX(40px) skewX(-10deg)}10%,80%{opacity:1;transform:skewX(-10deg)}100%{opacity:0}}
select.card{transform:none;width:100%}
@media(max-width:760px){.scr{flex-direction:column;justify-content:flex-start;overflow:auto;gap:12px}.title{margin-top:8px}}
@media(prefers-reduced-motion:reduce){#cap.pop,#cred.pop{animation-duration:.01s}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0 m</span><span id="hp"></span></div>
<div id="sty"></div><div id="cap"></div><div id="cred"><b id="c1"></b><span id="c2"></span></div>

<div class="scr" id="menu">
  <div class="title"><b>疾風<br>RUN</b><i>Run through the opening.</i></div>
  <div class="panel">
    <h2>Pick a song</h2><div class="row" id="songs"></div>
    <h2>Pick your runner</h2><div class="row" id="chars"></div>
    <h2>Look</h2><select id="look" class="card"><option value="0">Auto: changes with the music</option><option value="1">Anime</option><option value="2">Cartoon</option><option value="3">Paper</option><option value="4">Manga</option><option value="5">Comic</option><option value="6">3D</option><option value="7">Flat 2D</option><option value="8">Realistic</option></select>
    <h2>Your own song</h2><label class="card" style="transform:none"><input id="file" type="file" accept="audio/*" hidden><strong>Load an audio file</strong><br><span id="fn">Optional. Plays instead of the built-in track. Set its BPM below.</span></label>
    <label><small class="h">BPM of your file </small><input id="bpm" type="number" value="100" min="60" max="200" style="width:70px"></label>
    <button class="go" id="go">Start running</button>
    <small class="h">← → or swipe to change lane · ↑ / Space or swipe up to jump. Jump holes. Dodge buildings, trees and people.</small>
  </div>
</div>
<div class="scr off" id="end"><div class="panel" style="text-align:center;align-items:center"><h1 id="eh"></h1><h2 id="es"></h2><button class="go" id="again">Run again</button></div></div>

<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H;function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();

/* ---------- data ---------- */
const SC=[0,1,5,7,8]; // Japanese "in" scale
const SONGS=[
{rain:1,sc:[0,2,3,5,7,8,10],n:'Rain Letter',jp:'雨の手紙',bpm:92,root:57,bass:[0,5,2,6],sky:['#161d38','#4d5f96','#c7b4d8'],bld:[[60,70,110],[80,92,135],[100,105,150]],
 mel:[7,-1,6,4,-1,4,2,-1,3,-1,4,6,-1,4,3,-1,7,-1,8,9,-1,8,6,-1,7,6,4,3,2,-1,-1,-1]},
{n:'Sakura Sprint',jp:'桜スプリント',bpm:150,root:57,bass:[0,3,2,4],sky:['#2a1458','#ff6fa5','#ffc27a'],bld:[[70,50,120],[110,70,150],[150,90,170]],
 mel:[4,-1,5,7,-1,5,4,2,4,-1,5,7,9,7,5,-1,2,-1,4,5,-1,4,2,0,2,4,5,4,2,0,-1,-1]},
{n:'Neon Shibuya',jp:'ネオン渋谷',bpm:128,root:52,bass:[0,0,3,2],sky:['#06143a','#2b6cff','#3de0d0'],bld:[[30,50,110],[40,80,150],[20,110,160]],
 mel:[7,-1,-1,5,7,9,-1,7,5,-1,4,5,-1,2,4,-1,7,-1,9,10,9,7,5,-1,4,5,4,2,0,-1,2,-1]},
{n:'Yuuhi Line',jp:'夕陽ライン',bpm:172,root:55,bass:[2,0,3,4],sky:['#3a0d2e','#ff5a3c','#ffd36b'],bld:[[110,40,70],[150,60,70],[90,30,90]],
 mel:[5,5,7,9,7,5,4,-1,2,4,5,4,2,-1,0,-1,5,5,7,9,10,9,7,5,4,5,7,5,4,2,0,-1]}];
const CHARS=[
{n:'Hina',role:'Student sprinter',hair:[255,120,170],skin:[255,224,204],top:[245,245,255],legs:[30,44,120],eye:[255,90,150],long:1,skirt:1,rib:1},
{n:'Kaito',role:'Track captain',hair:[60,140,255],skin:[246,208,178],top:[255,140,40],legs:[30,34,62],eye:[40,90,210],spike:1,band:1,acc:[255,255,255]},
{n:'Ren',role:'Night courier',hair:[236,238,250],skin:[242,214,194],top:[34,34,46],legs:[70,34,56],eye:[255,60,90],scarf:1,acc:[255,60,90]}];
const PEOPLE=[{hair:[50,40,60],skin:[255,220,196],top:[255,200,90],legs:[60,60,100],eye:[60,60,90],long:1,skirt:1},{hair:[130,80,50],skin:[246,208,178],top:[90,200,255],legs:[40,40,70],eye:[60,60,90],spike:1},{hair:[255,230,120],skin:[255,224,204],top:[240,240,240],legs:[200,80,120],eye:[90,60,140],long:1,skirt:1,rib:1},{hair:[30,30,40],skin:[246,208,178],top:[255,110,110],legs:[40,40,60],eye:[40,40,60]}];
const MODES=[{ox:0,oy:3.4,oz:-7.5,la:9,fov:1,roll:0},{ox:6.5,oy:1.4,oz:-1.5,la:1,fov:1.15,roll:.07},{ox:0,oy:12,oz:-5,la:5,fov:.95,roll:0},{ox:-3.2,oy:.7,oz:-4,la:6,fov:1.35,roll:-.1},
{ox:0,oy:16,oz:-3,la:5,fov:1.05,roll:0},{ox:.9,oy:2.7,oz:-3.8,la:7,fov:1.5,roll:0},{ox:0,oy:6,oz:-16,la:10,fov:.8,roll:0},{ox:2,oy:1.8,oz:-3.4,la:3,fov:1.5,roll:.16}];
const STY=[
{k:'anime',n:'Anime',w:'疾風',sh:1,ol:1.6,olc:'#1b1340',bloom:.45,hill:'#6b5aa8',gnd:'#2b1f4f',road:['#5a4a86','#52427c'],walk:['#3d3566','#392f60']},
{k:'cartoon',n:'Cartoon',w:'BOING!',sh:.5,ol:3.5,olc:'#111',bloom:.15,sky:['#3ab8ff','#8fe3ff','#fff3a0'],hill:'#4fd0a0',gnd:'#6be28a',road:['#ff9ec7','#ff8ab9'],walk:['#ffe36e','#ffd84a'],bc:[[255,120,120],[120,200,255],[255,220,90]]},
{k:'paper',n:'Paper',w:'紙',sh:.35,ol:1.2,olc:'#5a3d2b',paper:1,bloom:.1,shd:['rgba(70,45,20,.5)',0,5,6],sky:['#f6e7c8','#f1d3a6','#efc39a'],hill:'#d9a77a',gnd:'#d9bf8f',road:['#c9a27a','#bf986f'],walk:['#e6cfa3','#ddc596'],bc:[[230,190,150],[200,160,120],[240,215,170]]},
{k:'manga',n:'Manga',w:'ドン！',sh:.2,ol:2.8,olc:'#000',gray:1,tone:1,sky:['#ffffff','#f1f1f1','#dcdcdc'],hill:'#bbb',gnd:'#e8e8e8',road:['#8a8a8a','#7d7d7d'],walk:['#bdbdbd','#b0b0b0'],bc:[[235,235,235],[200,200,200],[250,250,250]]},
{k:'comic',n:'Comic',w:'POW!',sh:.6,ol:3.2,olc:'#000',dots:1,bloom:.1,sky:['#ffe14d','#ff9a3d','#ff4f9a'],hill:'#ff4f9a',gnd:'#ff7ab8',road:['#3a2d7c','#33276f'],walk:['#ffd23f','#f5c518'],bc:[[255,80,140],[80,200,255],[255,220,60]]},
{k:'3d',n:'3D',w:'DEPTH',sh:1.8,ol:0,bloom:.9,shd:['rgba(0,0,0,.45)',16,0,8],sky:['#050a22','#1a4fd0','#3de0d0'],hill:'#16307a',gnd:'#101638',road:['#2a3358','#242c4e'],walk:['#3b4676','#343e6a'],bc:[[60,90,200],[40,150,200],[110,80,200]]},
{k:'flat',n:'Flat 2D',w:'2D',sh:0,ol:0,bloom:0,sky:['#ffd36b','#ffd36b','#ffd36b'],hill:'#ffb04a',gnd:'#ff8a5b',road:['#5b6bff','#5560f0'],walk:['#3b44c0','#3b44c0'],bc:[[91,107,255],[255,111,145],[60,200,170]]},
{k:'real',n:'Realistic',w:'REAL',sh:1.4,ol:0,bloom:.3,real:1,shd:['rgba(0,0,0,.5)',12,0,6],sky:['#2a3342','#6b7a8f','#b9b8b0'],hill:'#3a4656',gnd:'#2c3a2c',road:['#3b3d44','#36383f'],walk:['#585a60','#52545a'],bc:[[92,88,96],[110,100,92],[72,78,90]]}];
let ST=STY[0];
const STYSEQ=[0,5,1,6,3,7,4,2],DROPSEQ=[6,7,3,4,1,2,0,7];
function mkPat(w,fn){const c=document.createElement('canvas');c.width=c.height=w;fn(c.getContext('2d'),w);return ctx.createPattern(c,'repeat')}
const pDot=(col,w,r)=>mkPat(w,(x,z)=>{x.fillStyle='#fff';x.fillRect(0,0,z,z);x.fillStyle=col;x.beginPath();x.arc(z/2,z/2,r,0,7);x.fill()});
const pK=pDot('#555',12,3),pC=pDot('#ff4f9a',18,5.5),pPaper=mkPat(128,(x,z)=>{x.fillStyle='#fff';x.fillRect(0,0,z,z);for(let i=0;i<900;i++){x.fillStyle=`rgba(120,90,50,${Math.random()*.2})`;x.fillRect(Math.random()*z,Math.random()*z,1+Math.random()*2,1)}});
const bc=document.createElement('canvas'),bx=bc.getContext('2d');
const SEQ=[0,1,0,7,0,3,0,2],WORDS=['駆け抜けろ！','風になれ','止まるな','未来へ','全力疾走！'];
const LANE=2.4;
const rgb=(c,k=1)=>`rgb(${Math.min(255,c[0]*k|0)},${Math.min(255,c[1]*k|0)},${Math.min(255,c[2]*k|0)})`;

/* ---------- menu ---------- */
let si=0,ci=0;
const icon=c=>`<svg viewBox="0 0 44 44"><circle cx="22" cy="24" r="12" fill="${rgb(c.skin)}"/><path d="M8 24C8 8 36 8 36 24 30 16 14 16 8 24Z" fill="${rgb(c.hair)}"/><circle cx="17" cy="26" r="2" fill="#222"/><circle cx="27" cy="26" r="2" fill="#222"/></svg>`;
function build(id,arr,get,html){const el=$(id);el.innerHTML='';arr.forEach((a,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=html(a);b.setAttribute('aria-pressed',i==get());b.onclick=()=>{set(i);[...el.children].forEach((x,j)=>x.setAttribute('aria-pressed',j==i))};el.appendChild(b)})}
let set;
set=i=>{si=i};build('#songs',SONGS,()=>si,s=>`<strong>${s.jp}</strong><span>${s.n} · ${s.bpm} BPM</span>`);
set=i=>{ci=i};build('#chars',CHARS,()=>ci,c=>`${icon(c)}<strong>${c.n}</strong><span>${c.role}</span>`);
// rebind song handlers (build captured `set` at click time, so rebuild songs with its own setter)
(()=>{const el=$('#songs');[...el.children].forEach((b,i)=>b.onclick=()=>{si=i;[...el.children].forEach((x,j)=>x.setAttribute('aria-pressed',j==i))})})();

/* ---------- audio (original synth tracks) ---------- */
let ac,master,noise,t0,nextT,step,song,timer,lp,src,rn,custom;
const mf=m=>440*Math.pow(2,(m-69)/12),dg=d=>{const S=song.sc||SC,n=S.length;return S[((d%n)+n)%n]+12*Math.floor(d/n)};
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function kick(t,v=.9){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
function hat(t,v,hp,d=.06){const n=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();n.buffer=noise;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+d+.02)}
function riser(t,d){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(2400,t+d);g.gain.setValueAtTime(.005,t);g.gain.exponentialRampToValueAtTime(.09,t+d*.98);g.gain.linearRampToValueAtTime(0,t+d+.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)}
// structure in beats: 0-16 intro, 16-48 verse, 48-64 build (crescendo), 64-112 drop, 112-128 outro
function sched(){while(nextT<ac.currentTime+.25){const bs=60/song.bpm,sd=bs/2,t=nextT,i=step%32,b=step/2,ch=song.bass[(step>>3)%4],build=b>=48&&b<64,drop=b>=64&&b<112;
 if(step==0)lp.frequency.setValueAtTime(2500,t);
 if(step==32){lp.frequency.setValueAtTime(2500,t);lp.frequency.exponentialRampToValueAtTime(16000,t+bs*8)}
 if(step==96){lp.frequency.setValueAtTime(1200,t);lp.frequency.exponentialRampToValueAtTime(16000,t+bs*16);riser(t,bs*16)}
 if(step==224){lp.frequency.setValueAtTime(16000,t);lp.frequency.exponentialRampToValueAtTime(2500,t+bs*8)}
 const an=song.root+dg(ch+[0,2,4,7,4,2,4,2][step%8])+12;
 tone(mf(an),t,sd*3,'triangle',drop?.06:.1);tone(mf(an+12),t,sd*2,'sine',.04);
 if(step%8==0)tone(mf(song.root+dg(ch)),t,sd*8,'sawtooth',build?.04:.025);
 if(b>=8&&step%2==0)tone(mf(song.root-12+dg(ch)),t,sd*1.8,'triangle',.28);
 const m=song.mel[i];if(m>=0&&b>=24&&b<112){tone(mf(song.root+12+dg(m)),t,sd*1.7,drop?'square':'triangle',drop?.06:.1);if(drop)tone(mf(song.root+24+dg(m)),t,sd*1.2,'sawtooth',.025)}
 if(b>=16&&b<48){if(step%8==0)kick(t,.5);if(b>=32&&step%2)hat(t,.1,8000)}
 if(build){if(step%2==0)hat(t,.15+.35*(b-48)/16,2500);if(b>=56)hat(t+sd/2,.3,2500);if(b>=62){hat(t+sd/4,.4,2500);hat(t+sd*.75,.4,2500)}}
 if(drop){if(step%2==0)kick(t,1);if(step%4==2)hat(t,.6,2200);if(step%2)hat(t,.22,8000);if(step==128)hat(t,.9,1500,.9)}
 nextT+=sd;step++}}
function startMusic(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
 master=ac.createGain();master.gain.value=.55;lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=song.buf?20000:2500;master.connect(lp);lp.connect(ac.destination);
 noise=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 step=0;t0=nextT=ac.currentTime+.15;
 if(song.buf){src=ac.createBufferSource();src.buffer=song.buf;src.connect(master);src.start(t0)}else timer=setInterval(sched,40)}
function stopMusic(){clearInterval(timer);if(src){try{src.stop()}catch(e){}src=null}if(master)master.gain.setTargetAtTime(0,ac.currentTime,.1)}

/* ---------- camera / projection ---------- */
const cam={...MODES[0],x:0,y:3,z:-7,yaw:0,pit:0,roll:0};
function P(x,y,z,clamp){const dx=x-cam.x,dy=y-cam.y,dz=z-cam.z,c=Math.cos(cam.yaw),s=Math.sin(cam.yaw);
 const x1=dx*c-dz*s,z1=dx*s+dz*c,cp=Math.cos(cam.pit),sp=Math.sin(cam.pit);
 const y1=dy*cp-z1*sp;let z2=dy*sp+z1*cp;if(z2<.3){if(!clamp)return null;z2=.3}
 const f=Math.min(H*.95,W*1.1)*cam.fov/z2;return[W/2+x1*f,H/2-y1*f,z2,f]}
function quad(a,b,c,d,fill,ol){if(!a||!b||!c||!d)return;ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fill();if(ol&&ST.ol){ctx.strokeStyle=ST.olc;ctx.lineWidth=ST.ol;ctx.lineJoin='round';ctx.stroke()}}
function box(x,y,z,w,h,d,c){const x0=x-w/2,x1=x+w/2,z0=z-d/2,z1=z+d/2,y1=y+h;

function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running){update(dt);}if(G&&(running||!$('#end').classList.contains('off')))render(dt);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
$('#go').onclick=()=>{reset();if(custom)song={...SONGS[si],n:'Your track',jp:'マイソング',bpm:+$('#bpm').value||100,buf:custom};G.lock=+$('#look').value;ST=STY[G.lock?G.lock-1:0];startMusic();$('#menu').classList.add('off');$('#end').classList.add('off');$('#hud').style.display='flex';
 $('#c1').textContent=song.jp;$('#c2').textContent=`${song.n}  /  starring ${G.ch.n}`;const cr=$('#cred');cr.classList.remove('pop');void cr.offsetWidth;cr.classList.add('pop');
 last=performance.now();running=true};
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;ac=ac||new (window.AudioContext||window.webkitAudioContext)();try{custom=await ac.decodeAudioData(await f.arrayBuffer());$('#fn').textContent=f.name}catch(_){custom=null;$('#fn').textContent='Could not read that file'}};
$('#again').onclick=()=>{$('#end').classList.add('off');$('#menu').classList.remove('off')};
function lane(d){if(running)G.lane=Math.max(-1,Math.min(1,G.lane+d))}
function jump(){if(running&&G.py<=0&&G.vy<=0)G.vy=8.5}
addEventListener('keydown',e=>{if(e.key=='ArrowLeft'||e.key=='a')lane(-1);else if(e.key=='ArrowRight'||e.key=='d')lane(1);else if(e.key=='ArrowUp'||e.key==' '||e.key=='w'){e.preventDefault();jump()}});
let tp;addEventListener('touchstart',e=>{tp=e.touches[0]},{passive:true});
addEventListener('touchend',e=>{if(!tp||!running)return;const t=e.changedTouches[0],dx=t.clientX-tp.clientX,dy=t.clientY-tp.clientY;
 if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)lane(dx>0?1:-1);else if(dy<-25||(Math.abs(dx)<10&&Math.abs(dy)<10))jump();tp=null});
