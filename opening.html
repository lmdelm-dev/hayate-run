<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hayate Run — Anime Opening</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090b20}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:16px auto auto 16px;z-index:2;font:700 14px system-ui;color:#fff;text-shadow:2px 2px #111;opacity:.85}#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#14112f,#79295f);z-index:4;color:white;font:700 20px system-ui}button{padding:14px 22px;border:0;border-radius:10px;font-weight:800;cursor:pointer}</style></head><body><canvas id="c"></canvas><div id="ui">HAYATE RUN · ANIME OPENING</div><div id="start"><button>START OPENING</button></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const envNames=['Anime School','Japanese City','Rainy City','Cherry-Blossom Road','Forest','Mountain','Beach','Neon Cyberpunk City','Fantasy Town','Space Sci-Fi','Sunset Highway','Snow Shrine'];
const envs=Array.from({length:120},(_,i)=>{let base=envNames[i%envNames.length];let v=Math.floor(i/envNames.length)+1;return{id:i,name:base+' '+String(v).padStart(2,'0'),type:i%envNames.length,license:'CC0 / original procedural',source:'Hayate Run original generator'}});
const manifests=envs;
const music={bpm:128,beats:128};let started=false,t0=0,audio,master;
function beat(t){return Math.floor(t*music.bpm/60)}
function envAt(b){return manifests[Math.floor(b/8)%manifests.length]}
function camera(b){const p=b%32;if(p<8)return{mode:'rear chase',zoom:1};if(p<16)return{mode:'side tracking',zoom:1.1};if(p<20)return{mode:'front',zoom:1.2};if(p<24)return{mode:'close-up',zoom:1.45};if(p<28)return{mode:'wide',zoom:.82};return{mode:'elevated',zoom:.95}}
function sky(type){const s=[['#121737','#394d8c','#f7a3bd'],['#08152e','#175b8a','#ffd36e'],['#071021','#303a5d','#7887b8'],['#3a164e','#ff7aa8','#ffd17b'],['#102b24','#3d8a62','#b9e08a'],['#13284d','#557fb7','#e8d0b1'],['#2e82bd','#75d9ef','#ffe1a1'],['#06061b','#5d1ca6','#18e5e0'],['#45251e','#c56d4b','#f2c878'],['#02030e','#101f55','#8fd8ff'],['#4a1e22','#e85d50','#ffd56d'],['#0e1730','#8da7d4','#eef6ff']];return s[type%12]}
function drawEnv(type,b){let s=sky(type),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,s[0]);g.addColorStop(.62,s[1]);g.addColorStop(1,s[2]);x.fillStyle=g;x.fillRect(0,0,W,H);let horizon=H*.58;
 if(type===6){x.fillStyle='#f3d5a5';x.fillRect(0,horizon,W,H-horizon);x.fillStyle='#45a9c7';x.fillRect(0,horizon*.83,W,H*.18)} else if(type===9){x.fillStyle='#050713';x.fillRect(0,horizon,W,H-horizon);for(let i=0;i<70;i++){let px=(i*137+b*1.7)%W,py=(i*83)%horizon;x.fillStyle=i%4?'#bde7ff':'#fff';x.fillRect(px,py,1.5,1.5)}} else {x.fillStyle=type===4?'#214d39':type===7?'#10122b':'#26304a';x.fillRect(0,horizon,W,H-horizon)}
 for(let i=0;i<28;i++){let px=((i*173-b*3)%(W+220))-110;let h=30+((i*47+type*31)%100);if([0,1,2,7,8].includes(type)){x.fillStyle=type===7?'#171334':'#27304b';x.fillRect(px,horizon-h,70,h);for(let wy=0;wy<4;wy++)for(let wx=0;wx<3;wx++){x.fillStyle=(i+wx+wy+b)%3===0?'#ffd36e':'#38506a';x.fillRect(px+10+wx*18,horizon-h+12+wy*18,7,9)}}else{x.fillStyle=type===5?'#486d9d':type===4?'#1e6244':'#596477';x.beginPath();x.moveTo(px,horizon);x.lineTo(px+45,horizon-h);x.lineTo(px+90,horizon);x.fill()}}
 x.fillStyle=type===7?'#151525':'#343342';x.beginPath();x.moveTo(W*.43,horizon);x.lineTo(W*.57,horizon);x.lineTo(W*.95,H);x.lineTo(W*.05,H);x.fill();x.strokeStyle='#f3e8b0';x.lineWidth=4;x.setLineDash([28,24]);x.lineDashOffset=-b*10;x.beginPath();x.moveTo(W*.5,horizon);x.lineTo(W*.5,H);x.stroke();x.setLineDash([]);
 if(type===2){x.strokeStyle='rgba(170,200,255,.45)';for(let i=0;i<90;i++){let px=(i*71+b*9)%W,py=(i*43+b*17)%H;x.beginPath();x.moveTo(px,py);x.lineTo(px-7,py+18);x.stroke()}}if(type===3){x.fillStyle='rgba(255,170,200,.8)';for(let i=0;i<35;i++){let px=(i*83-b*5)%W,py=(i*37+b*3)%H;x.beginPath();x.arc(px,py,3,0,7);x.fill()}}
}
function limb(px,py,ang,len,w){x.save();x.translate(px,py);x.rotate(ang);x.fillRect(-w/2,0,w,len);x.restore()}
function hero(t,cam){let cx=W/2,base=H*.76,run=t*12,step=Math.sin(run),step2=Math.sin(run+Math.PI),scale=Math.min(W,H)/800*cam.zoom;x.save();x.translate(cx,base+Math.abs(step)*-7*scale);x.scale(scale,scale);x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(0,35,32,9,0,0,7);x.fill();
 x.fillStyle='#151b36';x.beginPath();x.ellipse(0,-88,31,38,0,0,7);x.fill();x.fillStyle='#e8bfa7';x.beginPath();x.arc(0,-84,24,0,7);x.fill();x.fillStyle='#263c87';x.beginPath();x.moveTo(-27,-96);x.quadraticCurveTo(-8,-137,20,-108);x.lineTo(29,-72);x.lineTo(4,-88);x.lineTo(-28,-65);x.closePath();x.fill();x.fillStyle='#f04f78';x.fillRect(-25,-55,50,65);x.fillStyle='#26314f';x.fillRect(-23,10,46,40);
 x.strokeStyle='#f04f78';x.lineWidth=9;limb(-22,-48,step*.65-.25,48,9);limb(22,-48,step2*.65+.25,48,9);x.strokeStyle='#26314f';limb(-15,48,step*.8+.2,58,11);limb(15,48,step2*.8-.2,58,11);x.strokeStyle='#ff6f9f';x.lineWidth=7;x.beginPath();x.moveTo(18,-45);x.quadraticCurveTo(65+step*12,-20,90+step*18,-50);x.stroke();x.strokeStyle='#263c87';x.lineWidth=6;x.beginPath();x.moveTo(-14,-112);x.quadraticCurveTo(-55-step*12,-95,-70-step*18,-125);x.stroke();x.restore()}
function title(b){if(b<8)return;x.save();x.globalAlpha=Math.max(0,1-(b-72)/10);x.translate(W*.08,H*.2);x.transform(1,-.12,0,1,0,0);x.font='900 8vw system-ui';x.fillStyle='#fff';x.strokeStyle='#14102f';x.lineWidth=8;x.strokeText('HAYATE RUN',0,0);x.fillText('HAYATE RUN',0,0);x.font='800 18px system-ui';x.fillStyle='#ff82b1';x.fillText('疾風 — ANIME OPENING',5,32);x.restore()}
function frame(ms){if(!started)return;let t=(ms-t0)/1000,b=beat(t),e=envAt(b),cam=camera(b);drawEnv(e.type,b);let cut=b%8;if(cut<1){x.fillStyle='rgba(255,255,255,'+(1-cut)+')';x.fillRect(0,0,W,H)}hero(t,cam);title(b);if(b>=48&&b<64){x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,0,W,H);for(let i=0;i<18;i++){x.fillStyle='rgba(255,220,240,.25)';x.fillRect((i*97+b*9)%W,(i*53)%H,2,2)}}if(b>=64){x.fillStyle='rgba(255,120,170,.08)';x.fillRect(0,0,W,H)}document.querySelector('#ui').textContent=`${e.name} · ${cam.mode} · BEAT ${b}`;requestAnimationFrame(frame)}
function startAudio(){audio=new AudioContext();master=audio.createGain();master.gain.value=.07;master.connect(audio.destination);let next=0;function tick(){let now=audio.currentTime;if(now>next){let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=220*Math.pow(2,(Math.floor(next*music.bpm/60)%8)/12);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.2,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.12);o.connect(g).connect(master);o.start(now);o.stop(now+.14);next+=60/music.bpm/2}requestAnimationFrame(tick)}}
document.querySelector('#start button').onclick=()=>{started=true;document.querySelector('#start').remove();startAudio();t0=performance.now();requestAnimationFrame(frame)};
</script></body></html>
