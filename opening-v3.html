<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hayate Run — Anime Opening V3</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08091b;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:3;font-weight:800;text-shadow:2px 2px #000;pointer-events:none}#picker{position:fixed;left:14px;bottom:14px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;max-width:min(760px,92vw)}button{background:#171936;color:#fff;border:1px solid #5960a8;border-radius:8px;padding:7px 10px;cursor:pointer}button.active{background:#ff4f93;border-color:#fff}.hide{display:none!important}#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#713a73,#100d27);z-index:5}#start button{font-size:22px;padding:18px 30px;background:#ff4f93}</style></head><body><canvas id="c"></canvas><div id="hud"><span id="left">HAYATE RUN · OPENING V3</span><span id="right"></span></div><div id="picker"></div><div id="start"><button>START ANIME OPENING</button></div><script src="characters.js"></script><script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W,H,D,t0=0,started=false,selected=0;function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
const C=window.HAYATE_CHARACTERS;const names=['SCHOOL','CITY','RAIN','SAKURA','FOREST','MOUNTAIN','BEACH','CYBER','FANTASY','SPACE','SUNSET','SNOW'];
C.forEach((ch,i)=>{let b=document.createElement('button');b.textContent=ch.name;b.onclick=()=>{selected=i;document.querySelectorAll('#picker button').forEach(v=>v.classList.remove('active'));b.classList.add('active')};document.querySelector('#picker').appendChild(b)});document.querySelector('#picker button').classList.add('active');
function beat(t){return Math.floor(t*128/60)}function env(b){return Math.floor(b/8)%12}function camera(b){let p=b%32;return p<8?'REAR CHASE':p<14?'SIDE TRACK':p<18?'FRONT HERO':p<22?'CLOSE-UP':p<27?'WIDE GROUP':'AERIAL DROP'}
function palette(e){return[['#17183c','#43599b','#f7a1c1'],['#07152c','#126a93','#ffd36b'],['#08101e','#303e68','#8999c7'],['#3d174d','#ff6f9f','#ffd17b'],['#0b2c20','#347b50','#b9e08a'],['#13284b','#5d85b9','#ecd2ae'],['#2a86b8','#74d9e9','#ffe0a0'],['#06051c','#6a18a6','#17e7df'],['#4d271f','#bf674d','#f5ca79'],['#02030d','#10235e','#8bdcff'],['#4a2024','#e55b50','#ffd56d'],['#0e1830','#8ca7d2','#eff8ff']][e]}
function background(e,b){let p=palette(e),q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,p[0]);q.addColorStop(.6,p[1]);q.addColorStop(1,p[2]);g.fillStyle=q;g.fillRect(0,0,W,H);let h=H*.56;g.fillStyle=e===4?'#1d583b':e===7?'#111126':'#29344a';g.fillRect(0,h,W,H-h);if(e===9){g.fillStyle='#fff';for(let i=0;i<90;i++)g.fillRect((i*137+b*2)%W,(i*67)%h,1.5,1.5)}
 for(let i=0;i<24;i++){let px=(i*191-b*(e===2?5:2))%(W+180)-90,hh=35+(i*43+e*19)%115;g.fillStyle=e===7?'#1c1636':e===5?'#496b96':'#2b344b';if(e<4||e===7||e===8){g.fillRect(px,h-hh,76,hh);for(let y=0;y<4;y++)for(let z=0;z<3;z++){g.fillStyle=(i+y+z+b)%4===0?'#ffd36b':'#3a516d';g.fillRect(px+10+z*20,h-hh+12+y*19,8,9)}}else{g.beginPath();g.moveTo(px,h);g.lineTo(px+42,h-hh);g.lineTo(px+84,h);g.fill()}}
 g.fillStyle=e===7?'#11111f':'#353443';g.beginPath();g.moveTo(W*.44,h);g.lineTo(W*.56,h);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();g.strokeStyle='#eee2a8';g.lineWidth=4;g.setLineDash([28,24]);g.lineDashOffset=-b*9;g.beginPath();g.moveTo(W*.5,h);g.lineTo(W*.5,H);g.stroke();g.setLineDash([]);
 if(e===2){g.strokeStyle='rgba(190,215,255,.5)';for(let i=0;i<100;i++){let px=(i*71+b*10)%W,py=(i*41+b*19)%H;g.beginPath();g.moveTo(px,py);g.lineTo(px-8,py+20);g.stroke()}}if(e===3){g.fillStyle='rgba(255,170,205,.75)';for(let i=0;i<45;i++){let px=(i*91-b*6)%W,py=(i*47+b*4)%H;g.beginPath();g.arc(px,py,3,0,7);g.fill()}}
}
function rect(x,y,w,h,c,r=0){g.fillStyle=c;if(r){g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}else g.fillRect(x,y,w,h)}
function char(ch,t,mode,depth=1){let run=t*11*ch.speed,sw=Math.sin(run),sw2=Math.sin(run+Math.PI),front=mode==='FRONT HERO'||mode==='CLOSE-UP',side=mode==='SIDE TRACK',scale=Math.min(W,H)/720*(mode==='CLOSE-UP'?1.55:mode==='WIDE GROUP'?.62:1),cx=front?W*.5:side?W*.54:W*.5,base=H*.78;g.save();g.translate(cx,base+Math.abs(sw)*-7);g.scale(scale,scale);g.globalAlpha=depth;
 g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,20,35,9,0,0,7);g.fill();
 // flowing hair silhouette
 g.fillStyle=ch.hair;g.beginPath();g.ellipse(0,-102,34,43,0,0,7);g.fill();g.fillStyle=ch.hair2;g.beginPath();g.moveTo(-29,-108);g.quadraticCurveTo(-20,-150,16,-135);g.quadraticCurveTo(46,-119,28,-75);g.lineTo(11,-95);g.lineTo(-8,-70);g.lineTo(-39,-57);g.closePath();g.fill();
 // face only in front shots
 if(front){g.fillStyle=ch.skin;g.beginPath();g.ellipse(0,-91,25,29,0,0,7);g.fill();g.fillStyle=ch.eye;g.beginPath();g.ellipse(-9,-92,3,5,0,0,7);g.ellipse(9,-92,3,5,0,0,7);g.fill();g.strokeStyle='#7b3e4f';g.lineWidth=2;g.beginPath();g.arc(0,-84,7,.15,2.95);g.stroke()}
 // torso and outfit
 rect(-27,-63,54,72,ch.uniform,9);rect(-27,-63,54,10,ch.accent,3);rect(-22,8,44,43,ch.bottom,7);
 // running arms
 g.strokeStyle=ch.uniform;g.lineWidth=11;g.lineCap='round';g.beginPath();g.moveTo(-23,-50);g.lineTo(-47-sw*25,-8);g.moveTo(23,-50);g.lineTo(47-sw2*25,-8);g.stroke();
 // legs
 g.strokeStyle=ch.bottom;g.lineWidth=13;g.beginPath();g.moveTo(-14,48);g.lineTo(-25-sw*22,102);g.moveTo(14,48);g.lineTo(25-sw2*22,102);g.stroke();g.strokeStyle=ch.accent;g.lineWidth=7;g.beginPath();g.moveTo(-25-sw*22,102);g.lineTo(-48-sw*22,102);g.moveTo(25-sw2*22,102);g.lineTo(48-sw2*22,102);g.stroke();
 // accessories / motion trails
 g.strokeStyle=ch.accent;g.lineWidth=5;g.beginPath();if(ch.accessory==='scarf'||ch.accessory==='cape')g.moveTo(20,-43),g.quadraticCurveTo(70+sw*25,-20,105+sw*30,-52);else if(ch.accessory==='ribbon'||ch.accessory==='hairpin')g.moveTo(-20,-122),g.quadraticCurveTo(-65-sw*15,-95,-80-sw*20,-125);g.stroke();
 if(ch.accessory==='headband'||ch.accessory==='bandana'||ch.accessory==='cap'||ch.accessory==='visor')rect(-31,-116,62,8,ch.accent,4);if(ch.accessory==='goggles'){g.strokeStyle=ch.accent;g.lineWidth=4;g.strokeRect(-22,-105,17,11);g.strokeRect(5,-105,17,11)}if(ch.accessory==='earphones'){g.strokeStyle=ch.accent;g.lineWidth=4;g.beginPath();g.arc(0,-98,31,3.3,6.1);g.stroke()}
 g.restore()}
function group(t,b){let ids=[selected,(selected+1)%C.length,(selected+2)%C.length,(selected+3)%C.length];ids.forEach((id,i)=>{let ch=C[id],saveX=W/2+(i-1.5)*Math.min(W*.13,100);g.save();g.translate(saveX-W/2,0);char(ch,t,'WIDE GROUP',.85);g.restore()})}
function frame(ms){if(!started)return;let t=(ms-t0)/1000,b=beat(t),e=env(b),cam=camera(b),ch=C[selected];background(e,b);if(cam==='WIDE GROUP')group(t,b);else char(ch,t,cam);if(b%8<1){g.fillStyle='rgba(255,255,255,'+(1-b%8)+')';g.fillRect(0,0,W,H)}if(b>=48&&b<64){g.fillStyle='rgba(255,255,255,.08)';g.fillRect(0,0,W,H);for(let i=0;i<24;i++){g.fillStyle='rgba(255,220,245,.3)';g.fillRect((i*97+b*10)%W,(i*53+b*3)%H,2,2)}}if(b>=64){g.fillStyle='rgba(255,90,170,.08)';g.fillRect(0,0,W,H)}document.querySelector('#right').textContent=`${ch.name} · ${ch.archetype} · ${names[e]} · ${cam} · BEAT ${b}`;requestAnimationFrame(frame)}
let ac;function audio(){ac=new AudioContext();let master=ac.createGain();master.gain.value=.05;master.connect(ac.destination);let next=0;function tick(){let now=ac.currentTime;if(now>next){let o=ac.createOscillator(),q=ac.createGain();o.type='triangle';o.frequency.value=220*Math.pow(2,(Math.floor(next*128/60)%12)/12);q.gain.setValueAtTime(.0001,now);q.gain.exponentialRampToValueAtTime(.15,now+.01);q.gain.exponentialRampToValueAtTime(.0001,now+.13);o.connect(q).connect(master);o.start(now);o.stop(now+.14);next+=60/128/2}requestAnimationFrame(tick)}}document.querySelector('#start button').onclick=()=>{started=true;document.querySelector('#start').classList.add('hide');audio();t0=performance.now();requestAnimationFrame(frame)};
</script></body></html>
